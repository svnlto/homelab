---
# Node-level agent: pod logs + host metrics + kubelet metrics, one per node.
# Based on ClickStack's official k8s_daemonset.yaml reference — the presets do
# the log collection, root securityContext, file-path metadata, pod association
# and RBAC that must otherwise be hand-rolled (and get subtly wrong).
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib

# Runs on every node, including the tainted observability node.
tolerations:
  - operator: Exists

# These collectors only scrape and tail — nothing sends to them. Disable every
# default receiver port so no unused hostPort is opened on each node.
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  # Self-telemetry port, scraped by the cluster Prometheus (see serviceMonitor)
  # so a stalled pipeline raises an alert.
  metrics:
    enabled: true

# A daemonset has no Service, so scrape each agent pod directly via a PodMonitor
# (a ServiceMonitor would round-robin one random pod per scrape).
podMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
  extraLabels:
    release: kube-prometheus-stack

# kubeletstats needs nodes/proxy on top of the preset RBAC.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [nodes/proxy]
      verbs: [get]

presets:
  logsCollection:
    enabled: true
    # Persist file positions so a restart does not re-read or drop logs. Also
    # switches the collector to root, which it needs to read /var/log/pods.
    storeCheckpoints: true
    # Never tail the collector's own output — avoids a log feedback loop.
    includeCollectorLogs: false
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
  kubeletMetrics:
    enabled: true

extraEnvs:
  # The team ingestion key the ClickStack collector requires on every OTLP
  # request. Delivered by ESO; see external-secret.yaml.
  - name: HYPERDX_API_KEY
    valueFrom:
      secretKeyRef:
        name: otel-hyperdx-apikey
        key: HYPERDX_API_KEY

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    kubeletstats:
      collection_interval: 20s
      auth_type: serviceAccount
      # Talos node names are not resolvable in cluster DNS, so the reference's
      # ${env:K8S_NODE_NAME} fails with "no such host". Use the node IP instead.
      endpoint: ${env:K8S_NODE_IP}:10250
      insecure_skip_verify: true
      metrics:
        k8s.pod.cpu_limit_utilization:
          enabled: true
        k8s.pod.cpu_request_utilization:
          enabled: true
        k8s.pod.memory_limit_utilization:
          enabled: true
        k8s.pod.memory_request_utilization:
          enabled: true
        k8s.pod.uptime:
          enabled: true
        k8s.node.uptime:
          enabled: true
        k8s.container.cpu_limit_utilization:
          enabled: true
        k8s.container.cpu_request_utilization:
          enabled: true
        k8s.container.memory_limit_utilization:
          enabled: true
        k8s.container.memory_request_utilization:
          enabled: true
        container.uptime:
          enabled: true
  exporters:
    otlphttp:
      endpoint: http://clickstack-hdx-oss-v2-otel-collector.clickstack.svc:4318
      compression: gzip
      headers:
        authorization: ${env:HYPERDX_API_KEY}
      # Persist the send queue to the hostPath-backed file_storage the
      # storeCheckpoints preset already provides, so a ClickStack outage queues
      # to disk and drains on recovery instead of dropping. The default
      # in-memory queue lost 134/600 records in the chaos test.
      sending_queue:
        enabled: true
        storage: file_storage
  processors:
    # Everything to warn: drop k8s-pod logs below WARN. Apps whose own level knob
    # can't reach warn (Servarr's config.xml floors at info, metallb, etc.) are
    # caught here by severity; untagged records (severity 0) are kept so nothing
    # is silently lost. Plus untagged per-item spam no level can suppress:
    #  - democratic-csi NodeGetVolumeStats shell-exec (lsblk/findmnt/realpath).
    #  - csi-proxy (csi-grpc-proxy) sidecar: every proxied gRPC call, Go stdlib log.
    #  - osxphotos-export CLI progress prints (per photo, not level-tagged).
    filter/csi_noise:
      error_mode: ignore
      logs:
        log_record:
          - 'severity_number >= SEVERITY_NUMBER_TRACE and severity_number < SEVERITY_NUMBER_WARN'
          - 'resource.attributes["k8s.namespace.name"] == "democratic-csi" and IsMatch(body, "executing (filesystem|mount)
            command")'
          - 'resource.attributes["k8s.container.name"] == "csi-proxy"'
          - 'resource.attributes["k8s.namespace.name"] == "osxphotos-export" and IsMatch(body, "^(Exporting|Exported|Skipped|Skipping|Processing|Copied|Copying|Cleaning|Deleting|Writing|Missing)
            ")'
  service:
    pipelines:
      logs:
        # Explicit list to insert filter after k8s_attributes (which sets the
        # namespace attr the filter matches on). Mirrors the preset defaults.
        processors: [memory_limiter, k8s_attributes, filter/csi_noise, batch]
        exporters: [otlphttp]
      metrics:
        exporters: [otlphttp]
