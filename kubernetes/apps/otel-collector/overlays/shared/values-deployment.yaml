---
# Cluster-level agent: Kubernetes events + cluster metrics. Exactly one replica —
# more would duplicate every event and metric. Based on ClickStack's official
# k8s_deployment.yaml reference.
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib

# May land on the observability node; tolerate its taint.
tolerations:
  - key: observability
    operator: Equal
    value: "true"
    effect: NoSchedule

ports:
  # Self-telemetry port, scraped by the cluster Prometheus (see serviceMonitor).
  metrics:
    enabled: true
  # Talos nodes ship service + kernel logs here as json_lines over TCP.
  talos:
    enabled: true
    containerPort: 5044
    servicePort: 5044
    protocol: TCP
  # TrueNAS ships syslog (RFC5424 over UDP) here.
  truenas:
    enabled: true
    containerPort: 5514
    servicePort: 5514
    protocol: UDP

# Expose the collector's own metrics to the existing kube-prometheus-stack.
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
  extraLabels:
    release: kube-prometheus-stack

presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
  kubernetesEvents:
    enabled: true
  clusterMetrics:
    enabled: true

extraEnvs:
  - name: HYPERDX_API_KEY
    valueFrom:
      secretKeyRef:
        name: otel-hyperdx-apikey
        key: HYPERDX_API_KEY

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

config:
  receivers:
    # Talos node logs (machined, kubelet, etcd, containerd + kernel via
    # KmsgLogConfig) arrive as newline-delimited json_lines. Each line has
    # msg, talos-level, talos-service, talos-time, plus the node extraTag.
    tcplog/talos:
      listen_address: 0.0.0.0:5044
      operators:
        - type: json_parser
          parse_from: body
          timestamp:
            parse_from: attributes["talos-time"]
            layout_type: gotime
            layout: "2006-01-02T15:04:05.999999999Z07:00"
          severity:
            parse_from: attributes["talos-level"]
        - type: move
          if: 'attributes["talos-service"] != nil'
          from: attributes["talos-service"]
          to: resource["service.name"]
        - type: move
          if: 'attributes.node != nil'
          from: attributes.node
          to: resource["host.name"]
        - type: move
          if: 'attributes.msg != nil'
          from: attributes.msg
          to: body
    # TrueNAS (192.168.0.13) forwards its syslog-ng output as RFC5424 over UDP.
    # Over TCP, syslog-ng's syslog() driver uses octet-counted framing (RFC6587)
    # that desynced against this receiver's octet parser: the stream got stuck in
    # a connect -> send -> EOF -> reopen(60s) loop and no message reached the
    # pipeline. UDP is one datagram per message — no framing to desync, each
    # record parses cleanly.
    syslog/truenas:
      udp:
        listen_address: 0.0.0.0:5514
      protocol: rfc5424
      operators:
        - type: move
          if: 'attributes.hostname != nil'
          from: attributes.hostname
          to: resource["host.name"]
        - type: move
          if: 'attributes.appname != nil'
          from: attributes.appname
          to: resource["service.name"]
        - type: move
          if: 'attributes.message != nil'
          from: attributes.message
          to: body
  processors:
    # Talos node logs to warn: drop everything below WARN (machined/kubelet/cri/
    # etcd emit constant info-level API-access + reconcile chatter; the collector
    # sets severity from talos-level, so a severity gate is exact). Keep unset
    # (severity_number == 0) so nothing untagged is silently lost. auditd carries
    # no level, so it is dropped by name (kube-proxy NETFILTER_CFG + permissive AVC).
    filter/talos_noise:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["service.name"] == "auditd"'
          - 'severity_number >= SEVERITY_NUMBER_TRACE and severity_number < SEVERITY_NUMBER_WARN'
  exporters:
    otlphttp:
      endpoint: http://clickstack-hdx-oss-v2-otel-collector.clickstack.svc:4318
      compression: gzip
      headers:
        authorization: ${env:HYPERDX_API_KEY}
  service:
    pipelines:
      logs:
        exporters: [otlphttp]
      # Separate pipeline so it does not collide with the kubernetesEvents
      # preset's own logs pipeline receivers.
      logs/talos:
        receivers: [tcplog/talos]
        processors: [filter/talos_noise]
        exporters: [otlphttp]
      logs/truenas:
        receivers: [syslog/truenas]
        exporters: [otlphttp]
      metrics:
        exporters: [otlphttp]
