---
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib

tolerations:
  - operator: Exists

presets:
  logsCollection:
    enabled: false
  kubernetesAttributes:
    enabled: false

# The team ingestion key that the bundled ClickStack collector requires on every
# OTLP request. Delivered by ESO into the otel-collector-ingest Secret and read
# here as ${env:HYPERDX_INGEST_KEY} inside the exporter's authorization header.
extraEnvs:
  - name: HYPERDX_INGEST_KEY
    valueFrom:
      secretKeyRef:
        name: otel-collector-ingest
        key: ingestionKey

extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: queue
    hostPath:
      path: /var/lib/otelcol-queue
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: queue
    mountPath: /var/lib/otelcol-queue

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, namespaces, nodes]
      verbs: [get, watch, list]
    - apiGroups: ["apps"]
      resources: [replicasets, deployments, statefulsets, daemonsets]
      verbs: [get, watch, list]
    - apiGroups: ["batch"]
      resources: [jobs]
      verbs: [get, watch, list]
    - apiGroups: [""]
      resources: [nodes/stats]
      verbs: [get]

config:
  extensions:
    # health_check is mandatory — the chart's liveness/readiness probes hit :13133
    health_check:
      endpoint: 0.0.0.0:13133
    file_storage:
      directory: /var/lib/otelcol-queue
  receivers:
    filelog:
      include: [/var/log/pods/*/*/*.log]
      exclude: [/var/log/pods/clickstack_*/*/*.log]
      start_at: end
      operators:
        - type: container
          id: container-parser
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100
    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.deployment.name
    batch: {}
  exporters:
    otlphttp:
      endpoint: http://clickstack-hdx-oss-v2-otel-collector.clickstack.svc:4318
      headers:
        authorization: ${env:HYPERDX_INGEST_KEY}
      sending_queue:
        enabled: true
        storage: file_storage
  service:
    extensions: [health_check, file_storage]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp]
