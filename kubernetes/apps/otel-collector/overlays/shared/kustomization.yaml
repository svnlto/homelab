---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-collector
resources:
  - namespace.yaml
  - helmrepository.yaml
  - external-secret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: otel-collector-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
