---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: database
spec:
  interval: 10m
  releaseName: postgresql
  chart:
    spec:
      chart: ./charts/postgresql
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values
  upgrade:
    remediation:
      retries: 0
