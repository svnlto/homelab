---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: osxphotos-export
  namespace: osxphotos-export
spec:
  interval: 10m
  releaseName: osxphotos-export
  chart:
    spec:
      chart: ./charts/osxphotos-export
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: osxphotos-export-values
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
