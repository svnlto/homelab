---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clickstack
resources:
  - namespace.yaml
  - helmrepository.yaml
  - external-secret.yaml
  - helmrelease.yaml
  - clickhouse-config-overrides.yaml
configMapGenerator:
  - name: clickstack-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
