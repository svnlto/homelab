---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 10m
  releaseName: immich
  chart:
    spec:
      chart: ./charts/immich
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
  upgrade:
    # one-way DB migrations: a rolled-back pod cannot read the migrated schema
    remediation:
      retries: 0
