---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/immich/overlays/shared
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: postgresql
