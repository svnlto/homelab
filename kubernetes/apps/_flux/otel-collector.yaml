---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: clickstack
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/otel-collector/overlays/shared
  prune: true
  wait: true
  timeout: 10m
