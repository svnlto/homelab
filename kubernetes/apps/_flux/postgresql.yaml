---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/postgresql/overlays/shared
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: cnpg-operator
