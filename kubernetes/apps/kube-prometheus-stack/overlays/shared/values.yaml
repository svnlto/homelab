---
# Cilium runs kubeProxyReplacement=true, so there is no kube-proxy DaemonSet.
# Leaving this enabled produces permanent "target down" noise.
kubeProxy:
  enabled: false

# Talos binds etcd, scheduler and controller-manager to localhost by design.
# Exposing them needs a machine-config patch, and etcd's listen-metrics-urls
# additionally needs a control-plane reboot. None of it tells you anything about
# the internet connection, so it is deliberately out of scope here — see
# "Deferred: control-plane metrics" below. Left enabled, these produce permanent
# "target down" noise that would drown the WAN targets.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

prometheus:
  prometheusSpec:
    logLevel: warn
    # 60s (default 30s) halves TSDB write volume — eases the shared ssd pool.
    # WAN probe resolution is unaffected (it arrives via Pi remote-write).
    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 90d
    # ~80% of the PV. Whichever limit trips first wins, so a cardinality spike
    # evicts old blocks instead of filling the PVC and crash-looping Prometheus.
    retentionSize: 40GB
    walCompression: true
    # Accepts backfill from a Pi agent that has been buffering through an
    # outage. At the default 0s those samples are rejected as out of bounds.
    enableRemoteWriteReceiver: true
    tsdb:
      outOfOrderTimeWindow: 72h
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi-rwo-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    # Mounted by the operator at /etc/alertmanager/secrets/<name>/<key>.
    secrets:
      - alertmanager-telegram
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  config:
    route:
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: telegram
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          # Both values come from 1Password via ESO — this repo is public, so
          # neither the token nor the chat ID may appear in git.
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/BOT_TOKEN
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/CHAT_ID
            # Plain text: alert annotations contain PromQL, and an unescaped
            # "<" makes Telegram reject an HTML-parsed message outright.
            parse_mode: ""
            send_resolved: true

grafana:
  # Dashboards live in git and are loaded by the sidecar, so no PVC is needed.
  # Lost: UI-authored edits, annotations, API keys, favourites.
  persistence:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
