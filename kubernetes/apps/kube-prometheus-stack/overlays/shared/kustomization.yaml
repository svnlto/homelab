---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ingress-grafana.yaml
  - external-secret-remotewrite.yaml
  - middleware-basicauth.yaml
  - ingress-remotewrite.yaml
configMapGenerator:
  - name: kube-prometheus-stack-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
