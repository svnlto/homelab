---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/svnlto/homelab
    targetRevision: main
    path: kubernetes/argocd-apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # Auto-sync frozen during ArgoCD -> Flux migration (see migration plan Phase 3.0).
  # Prevents root recreating/pruning children mid-cutover. Restore at Phase 4 cleanup.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
