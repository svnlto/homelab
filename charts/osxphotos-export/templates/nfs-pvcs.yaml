{{- range .Values.nfs.volumes }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .pvcName }}
  annotations:
  {{- range $key, $val := $.Values.global.annotations }}
    {{ $key }}: {{ $val | quote }}
  {{- end }}
spec:
  accessModes:
    - {{ .accessMode }}
  storageClassName: ""
  resources:
    requests:
      storage: {{ .capacity }}
  volumeName: {{ .pvName }}
{{- end }}
