---
global:
  annotations: {}

# -- Container image
image:
  repository: ghcr.io/svnlto/osxphotos-export
  tag: latest@sha256:41c308ea3c71b6b03c4d9dfaae062954b5d423a37e95b041127785f5972b035c

# -- Container resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 4Gi

# -- Environment variables
env:
  EXPORT_DB_PATH: /cache/osxphotos_export.db
  SYNC_INTERVAL: "3600"
  RETRY_INTERVAL: "300"
  OTEL_SERVICE_NAME: osxphotos-export

# -- Prometheus metrics endpoint and staleness alerting
metrics:
  enabled: true
  port: 9184
  scrapeInterval: 5m
  # Without this label the operator silently ignores both objects.
  selectorLabels:
    release: kube-prometheus-stack
  staleAfterSeconds: 21600

# -- Security context for the container
securityContext:
  runAsUser: 1003
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- NFS storage for source and export
nfs:
  server: ""
  mountOptions:
    - nfsvers=4.2
    - rsize=1048576
    - wsize=1048576
    - hard
    - noatime
    - nconnect=8
  volumes: []

# -- CSI storage for cache volume
csi:
  driver: org.democratic-csi.nfs-fast
  storageClassName: truenas-nfs-fast
  server: ""
  basePath: /mnt/ssd/kubernetes/nfs-dynamic
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - nodiratime
  volumes: []

# -- External secrets configuration
externalSecret:
  refreshInterval: 1h
  secretStoreName: onepassword
  secretStoreKind: ClusterSecretStore
  targetSecretName: osxphotos-config
  onePasswordItem: osxphotos-config
  keys:
    - EXPORT_DEST
    - LIBRARY_PATH
