---
global:
  annotations: {}

timezone: Europe/Berlin

# -- NFS storage for media
nfs:
  server: ""
  mountOptions:
    - nfsvers=4.2
    - rsize=1048576
    - wsize=1048576
    - hard
    - noatime
    - nconnect=8
  volumes: []

# -- iSCSI storage for app config volumes (SQLite-safe)
iscsi:
  driver: org.democratic-csi.iscsi
  storageClassName: truenas-iscsi-rwo
  portal: ""
  iqnPrefix: iqn.2005-10.org.freenas.ctl:csi-
  iqnSuffix: -shared
  volumes: []

# -- CSI storage for app config volumes
csi:
  driver: org.democratic-csi.nfs-fast
  storageClassName: truenas-nfs-fast
  server: ""
  basePath: /mnt/ssd/kubernetes/nfs-dynamic
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - nodiratime
  volumes: []

# -- External secrets configuration
externalSecret:
  refreshInterval: 12h
  secretStoreName: onepassword
  secretStoreKind: ClusterSecretStore
  targetSecretName: arr-secrets
  onePasswordItem: arr-stack-secrets
  keys:
    - WIREGUARD_PRIVATE_KEY
    - WIREGUARD_ADDRESSES
    - RADARR_API_KEY
    - SONARR_API_KEY
    - PROWLARR_API_KEY
    - LIDARR_API_KEY
    - JELLYFIN_API_KEY
    - NAVIDROME_USER
    - NAVIDROME_PASSWORD

# -- Downloaders pod (gluetun VPN + download clients)
downloaders:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    vpnProvider: protonvpn
    serverCountries: Sweden
    firewallInputPorts: "8080,9696,8191,5030"
    firewallOutboundSubnets: "10.96.0.0/12,10.244.0.0/16"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        # Measured peak 246Mi; at a 256Mi ceiling the Go GC thrashes and the
        # startup probe times out even though the tunnel is up.
        memory: 512Mi
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.0.4-ls263@sha256:f12cb77b4e16d2d60fc8226e433daf69884e83874d90447c6ff1d57ef4247d6f
    port: 8080
    # Incomplete (temporary) downloads on the ssd pool, off bulk, so active
    # Usenet writes don't starve Jellyfin reads. Completed files still land on bulk.
    incomplete:
      enabled: true
      storageClassName: truenas-nfs-fast
      size: 100Gi
      mountPath: /incomplete
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
  slskd:
    image: slskd/slskd:0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
    port: 5030
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        # Measured peak 251Mi against a 256Mi ceiling; OOMKilled 31 times.
        memory: 512Mi
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls155@sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179
    port: 9696
    # -- Servarr log level (trace|debug|info|warn); trims routine INFO noise
    logLevel: warn
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    port: 8191
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# -- Arr apps (radarr, sonarr, lidarr)
radarr:
  image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312@sha256:e35056574cdc695a9ee745aa1ecda9eab3842450bf4b7b8471b023790fa3861d
  port: 7878
  probePath: /ping
  # -- Servarr log level (trace|debug|info|warn); trims routine INFO noise
  logLevel: warn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

sonarr:
  image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
  port: 8989
  probePath: /ping
  # -- Servarr log level (trace|debug|info|warn); trims routine INFO noise
  logLevel: warn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

lidarr:
  image: ghcr.io/hotio/lidarr:pr-plugins-3.0.0.4856
  port: 8686
  probePath: /ping
  # -- Servarr log level (trace|debug|info|warn); trims routine INFO noise
  logLevel: warn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# -- Recyclarr CronJob
recyclarr:
  image: ghcr.io/recyclarr/recyclarr:8.7.0@sha256:2d6107f758d882a59fe9d646aa54fa8a5a4fb7a40995125fade575652a3f7871
  schedule: "0 4 * * 1"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -- Buildarr deployment
buildarr:
  image: callum027/buildarr:0.7.8@sha256:57e2343fefe5d5701364b5e93b4985dbf08310d7b152f70556bdaba7e9475447
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

glance:
  image: glanceapp/glance:v0.8.5@sha256:32ab73d80f2b8b5fb0735b0431deb36b93fbb6b2fb43592449b0178c8b83e350
  port: 8080
  jellyfinUserName: ""
  jellyfinLibraries:
    - Shows
    - Movies
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -- Ingress configuration
ingress:
  enabled: false
  domain: ""
  annotations: {}
  hosts: []
