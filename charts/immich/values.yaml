---
global:
  annotations: {}

server:
  image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
  port: 2283
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  gpu:
    enabled: false
    # renderD128 is the virtio console adapter; numeric nodes are not stable.
    renderNode: /dev/dri/by-path/pci-0000:01:00.0-render
  nodeSelector: {}
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 8000m
      memory: 8Gi

workers:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 6Gi

machineLearning:
  image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
  port: 3003
  gpu:
    enabled: false
    # renderD128 is the virtio console adapter; numeric nodes are not stable.
    renderNode: /dev/dri/by-path/pci-0000:01:00.0-render
  nodeSelector: {}
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 8Gi

# -- NFS storage for external photo libraries
nfs:
  server: ""
  mountOptions:
    - nfsvers=4.2
    - rsize=1048576
    - wsize=1048576
    - hard
    - noatime
    - nconnect=8
  volumes: []

# -- CSI NFS storage for upload and ml-cache
csi:
  driver: org.democratic-csi.nfs-fast
  storageClassName: truenas-nfs-fast
  server: ""
  basePath: /mnt/ssd/kubernetes/nfs-dynamic
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - nodiratime
  volumes: []

# -- Ingress configuration
ingress:
  enabled: false
  domain: ""
  annotations: {}

# -- External secrets configuration
externalSecret:
  refreshInterval: 12h
  secretStoreName: onepassword
  secretStoreKind: ClusterSecretStore
  targetSecretName: immich-secrets
  onePasswordItem: immich-secrets
  keys:
    - DB_PASSWORD
    - REDIS_PASSWORD
    - IMMICH_SECRET_KEY
